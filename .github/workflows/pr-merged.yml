name: PR Merged — App CI + Push
on:
  push:
    branches: [main]
    paths-ignore:
      - 'iac/**'
      - '**/Jenkinsfile'

jobs:
  app-ci:
    uses: proops2026-taskmanager/proops2026-cicd-platform/.github/workflows/reusable-app-ci.yml@v1
    with:
      runtime-version: "20"
      project-name: "proops2026"
      service-name: "user-service"
      image-tag: ${{ github.sha }}
      push-image: true                 # main = push
    secrets:
      # REGISTRY_USERNAME and REGISTRY_TOKEN auto-fall-back to GITHUB_TOKEN
      # if you're using GHCR (the default registry). Add explicit secrets here
      # if pushing to Docker Hub or another registry.
