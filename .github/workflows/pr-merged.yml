name: PR Merged — App CI + Push
on:
  push:
    branches: [main]
    paths-ignore:
      - 'iac/**'
      - '**/Jenkinsfile'

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: proops2026-taskmanager/proops2026-cicd-platform/.github/workflows/reusable-build.yml@v3
    with:
      project-name: "proops2026-taskmanager"
      service-name: "user-service"
      db-name: "users_test_db"
      service-port: "3001"
      extra-env: |
        JWT_SECRET=test_secret_minimum_32_characters_long
        JWT_EXPIRES_IN=24h
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  deploy-dev:
    needs: build
    uses: proops2026-taskmanager/proops2026-cicd-platform/.github/workflows/reusable-deploy.yml@v3
    with:
      image-tag: ${{ needs.build.outputs.image-tag }}
      environment: dev
      project-name: "proops2026-taskmanager"
      service-name: "user-service"
      secret-name: "user-svc-secret"
      secret-literals: >-
        --from-literal=DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy
        --from-literal=JWT_SECRET=ci-stub-secret-minimum-32-chars-long
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  deploy-staging:
    needs: [build, deploy-dev]   # gated by dev — same image-tag, no rebuild
    uses: proops2026-taskmanager/proops2026-cicd-platform/.github/workflows/reusable-deploy.yml@v3
    with:
      image-tag: ${{ needs.build.outputs.image-tag }}
      environment: staging
      project-name: "proops2026-taskmanager"
      service-name: "user-service"
      secret-name: "user-svc-secret"
      secret-literals: >-
        --from-literal=DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy
        --from-literal=JWT_SECRET=ci-stub-secret-minimum-32-chars-long
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  deploy-prod:
    needs: [build, deploy-staging]   # gated by staging — same image-tag, no rebuild
    uses: proops2026-taskmanager/proops2026-cicd-platform/.github/workflows/reusable-deploy.yml@v3
    with:
      image-tag: ${{ needs.build.outputs.image-tag }}
      environment: prod   # required reviewers on this GitHub Environment pause the run for approval
      project-name: "proops2026-taskmanager"
      service-name: "user-service"
      secret-name: "user-svc-secret"
      secret-literals: >-
        --from-literal=DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy
        --from-literal=JWT_SECRET=ci-stub-secret-minimum-32-chars-long
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
