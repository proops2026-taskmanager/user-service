name: Deploy Prod (manual)
on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: "Commit SHA to deploy (copy from a pr-merged.yml build run)"
        type: string
        required: true

jobs:
  deploy:
    uses: proops2026-taskmanager/proops2026-cicd-platform/.github/workflows/reusable-deploy.yml@v3   
    with:
      image-tag: ${{ inputs.image-tag }}
      environment: prod  # required reviewers on this GitHub Environment pause the run for approval
      project-name: "proops2026-taskmanager"
      service-name: "user-service"
      secret-name: "user-svc-secret"
      secret-literals: >-
        --from-literal=DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy
        --from-literal=JWT_SECRET=ci-stub-secret-minimum-32-chars-long
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}